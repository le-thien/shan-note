<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e4b3b"/>
      <stop offset="100%" stop-color="#28634e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f291e" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <!-- Nền bo góc biểu tượng ứng dụng macOS / iOS -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
  
  <!-- Họa tiết nét vẽ thanh thoát -->
  <g filter="url(#shadow)">
    <!-- Vòng cung hình học thanh mảnh -->
    <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" stroke-dasharray="8 8"/>
    
    <!-- Đầu ngòi bút ký họa phong cách tối giản -->
    <path d="M150 360 C 200 340, 290 310, 360 220 C 375 200, 350 170, 320 185 C 260 220, 200 270, 150 360 Z" 
          fill="url(#goldGrad)" opacity="0.9"/>
    
    <!-- Chữ nét. trang nhã chính diện -->
    <text x="256" y="295" 
          font-family="-apple-system, BlinkMacSystemFont, 'Playfair Display', serif" 
          font-size="140" 
          font-weight="700" 
          font-style="italic" 
          fill="#ffffff" 
          text-anchor="middle"
          letter-spacing="-4">nét<tspan fill="#eab308">.</tspan></text>
          
    <!-- Nét gạch chân thanh mảnh -->
    <path d="M185 320 Q 256 338 325 320" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
